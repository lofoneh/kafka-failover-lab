# From Strimzi 1.3.1 examples/kafka/kafka-with-dual-role-nodes.yaml.
# Changed for a laptop: 2Gi volumes, 512 MB heap, plain listener only,
# no entity operator (topics are made by the trial script).
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  labels:
    strimzi.io/cluster: lab
spec:
  replicas: 3
  roles:
    - controller
    - broker
  jvmOptions:
    -Xms: 256m
    -Xmx: 512m
  resources:
    requests:
      memory: 1Gi
    limits:
      memory: 1536Mi
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 2Gi
        kraftMetadata: shared
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: lab
spec:
  kafka:
    version: 4.3.2
    metadataVersion: 4.3-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
