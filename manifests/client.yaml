# A client pod from the brokers' own image: it runs the topic tool, Kafka's
# verifiable producer (one JSON line per acked record) and the consumer.
apiVersion: v1
kind: Pod
metadata:
  name: client
spec:
  restartPolicy: Never
  containers:
    - name: client
      image: quay.io/strimzi/kafka:1.3.1-kafka-4.3.2
      command: ["sleep", "infinity"]
      env:
        - name: KAFKA_HEAP_OPTS
          value: "-Xmx256m"
      resources:
        requests:
          memory: 512Mi
